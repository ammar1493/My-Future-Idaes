# Production self-hosting stack — runs entirely on YOUR server + YOUR domain.
# No third-party SaaS: Postgres, the API, the web app, the LiveKit SFU, and the
# HTTPS reverse proxy all run here as containers.
#
#   1. Point two DNS A records at this server's public IP:
#        app.example.com   (the platform)
#        lk.example.com    (the LiveKit media server)
#   2. cp .env.prod.example .env.prod  and fill it in
#   3. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Caddy obtains Let's Encrypt certificates for both domains automatically.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: https://${APP_DOMAIN}
      LIVEKIT_URL: wss://${LIVEKIT_DOMAIN}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      # Same-origin: the SPA calls /api on its own domain (Caddy routes it to
      # the backend), so no separate API base is needed.
      args:
        VITE_API_BASE: ""
    restart: unless-stopped
    depends_on:
      - backend

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # WebRTC media. Open these on your firewall/cloud security group.
      - "7881:7881"                       # TCP fallback
      - "50000-50100:50000-50100/udp"     # RTP/RTCP (widen for many users)
    depends_on:
      - redis

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN}
    depends_on:
      - backend
      - frontend
      - livekit

volumes:
  pgdata:
  caddy_data:
  caddy_config:
